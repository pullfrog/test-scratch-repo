name: Rewait probe
on:
  workflow_dispatch:
    inputs:
      attempt:
        description: "wait window number"
        type: number
        default: 1
permissions:
  contents: read
  actions: write
concurrency:
  group: rewait-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      ATTEMPT: ${{ inputs.attempt }}
      MAX_ATTEMPTS: 3
    steps:
      - name: Wait
        id: wait
        run: |
          echo "window $ATTEMPT of $MAX_ATTEMPTS"
          for _ in 1; do
            if curl -sf "https://registry.npmjs.org/pullfrog/0.0.0-never" > /dev/null; then
              echo "served=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 20
          done
          echo "served=false" >> "$GITHUB_OUTPUT"
      - name: Dispatch the next wait window
        id: handoff
        if: steps.wait.outputs.served == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
            echo "::error::cap reached at window $ATTEMPT"
            exit 1
          fi
          gh workflow run rewait-probe.yml --repo "$GITHUB_REPOSITORY" --ref main -f attempt=$((ATTEMPT + 1))
          echo "::notice::dispatched window $((ATTEMPT + 1)) of $MAX_ATTEMPTS"
          sleep 30
      - name: Summary
        if: always()
        run: echo "served=${{ steps.wait.outputs.served }} handoff=${{ steps.handoff.outcome }} attempt=$ATTEMPT"
